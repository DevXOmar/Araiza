define command {
    command_name lab_http
    command_line /usr/bin/python3 /opt/lab/check_lab.py http $HOSTADDRESS$ $ARG1$ $ARG2$ $ARG3$ $ARG4$
}

define command {
    command_name lab_metric
    command_line /usr/bin/python3 /opt/lab/check_lab.py metric $HOSTADDRESS$ $ARG1$ $ARG2$ $ARG3$
}

define command {
    command_name lab_tcp
    command_line $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -w 1 -c 3 -t 4
}

define host {
    name araiza-host
    use generic-host
    check_interval 0.25
    retry_interval 0.25
    max_check_attempts 2
    notifications_enabled 0
    register 0
}

define service {
    name araiza-service
    use generic-service
    check_interval 0.25
    retry_interval 0.25
    max_check_attempts 2
    notifications_enabled 0
    register 0
}

define host {
    use araiza-host
    host_name docker-linux
    alias E-Ticketing docker-linux
    address metrics
    check_command lab_tcp!9100
}

define host {
    use araiza-host
    host_name database
    alias E-Ticketing database
    address db
    check_command lab_dns
}

define host {
    use araiza-host
    host_name java-app
    alias E-Ticketing java-app
    address java-monitor
    check_command lab_dns
}

define host {
    use araiza-host
    host_name portal
    alias E-Ticketing portal
    address proxy
    check_command lab_dns
}

define command {
    command_name lab_dns
    command_line /usr/bin/getent hosts $HOSTADDRESS$
}

define service {
    use araiza-service
    host_name portal
    service_description Portal HTTP
    check_command lab_http!80!/!1!3
}

define service {
    use araiza-service
    host_name database
    service_description Database TCP
    check_command lab_tcp!3306
}

define service {
    use araiza-service
    host_name java-app
    service_description Tomcat application HTTP
    check_command lab_http!8080!/!1!3
}

define service {
    use araiza-service
    host_name docker-linux
    service_description CPU used
    check_command lab_metric!cpu!75!90
}

define service {
    use araiza-service
    host_name docker-linux
    service_description Memory used
    check_command lab_metric!memory!75!90
}

define service {
    use araiza-service
    host_name docker-linux
    service_description Disk used
    check_command lab_metric!disk!80!95
}

define service {
    use araiza-service
    host_name docker-linux
    service_description Uptime
    check_command lab_metric!uptime!120!30
}
