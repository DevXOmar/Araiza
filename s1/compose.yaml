name: araiza-s1
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eticket
      MYSQL_USER: eticket_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/setup first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/setup first}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse 'SELECT 1'
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s
    networks: [data]
  web:
    image: wordpress:php8.3-apache
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: eticket
      WORDPRESS_DB_USER: eticket_app
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup first}
    volumes:
      - wp-data:/var/www/html
      - ./wordpress/ticket-booking.php:/usr/src/wordpress/wp-content/mu-plugins/ticket-booking.php:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, data]
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports: ["127.0.0.1:${WEB_PORT}:80"]
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
networks:
  edge:
    name: s1-edge-net
  data:
    name: eticket-net
    internal: true
volumes:
  db-data:
    name: eticket-db-data
  wp-data:
    name: s1-wp-data
