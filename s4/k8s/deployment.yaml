apiVersion: apps/v1
kind: Deployment
metadata:
  name: araiza-s4
  labels:
    app: araiza-s4
spec:
  replicas: 3
  revisionHistoryLimit: 4
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: araiza-s4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: araiza-s4
    spec:
      containers:
        - name: web
          image: araiza-s4:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 112Mi
            limits:
              memory: 384Mi
          env:
            - name: JAVA_OPTS
              value: "-Xms32m -Xmx128m"
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
