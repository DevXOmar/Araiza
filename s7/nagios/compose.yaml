services:
  metrics:
    profiles: [monitoring]
    image: python:3.12-slim
    command: ["python", "/opt/lab/metrics.py"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    volumes:
      - ./nagios/metrics.py:/opt/lab/metrics.py:ro
    networks: [edge]
  nagios:
    profiles: [monitoring]
    image: jasonrivers/nagios:latest
    platform: linux/amd64
    restart: unless-stopped
    environment:
      NAGIOSADMIN_USER: nagiosadmin
      NAGIOSADMIN_PASS: ${NAGIOS_PASSWORD:?Run scripts/setup first}
    ports: ["127.0.0.1:${NAGIOS_PORT}:80"]
    volumes:
      - ./nagios/lab.cfg:/opt/nagios/etc/conf.d/araiza.cfg:ro
      - ./nagios/check_lab.py:/opt/lab/check_lab.py:ro
    networks: [edge, data]
    depends_on:
      - metrics

  java-monitor:
    profiles: [monitoring]
    image: araiza-s7:v1
    pull_policy: never
    networks: [edge]
