name: araiza-s2
services:
  db:
    image: araiza-s2-postgres:15
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/setup first}
      LAB_DB_USER: hms_app
      LAB_DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup first}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$LAB_DB_PASSWORD" psql -h 127.0.0.1 -U "$$LAB_DB_USER" -d "$$POSTGRES_DB" -Atqc 'SELECT 1'
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s
    networks: [data]
  web:
    image: araiza-s2-compose:local
    build:
      context: .
      target: with-db
    environment:
      DB_URL: jdbc:postgresql://db:5432/hms?connectTimeout=3&socketTimeout=5
      DB_USER: hms_app
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup first}
      JAVA_OPTS: "-Xms32m -Xmx192m"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/lab/health"]
      interval: 5s
      timeout: 6s
      retries: 18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, data]
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports: ["127.0.0.1:${WEB_PORT}:80"]
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
networks:
  edge:
    name: s2-edge-net
  data:
    name: hms-net
    internal: true
volumes:
  db-data:
    name: s2-db-data
