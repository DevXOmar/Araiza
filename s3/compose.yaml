name: araiza-s3
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ors
      MYSQL_USER: ors_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/setup first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/setup first}
    volumes:
      - db-data:/var/lib/mysql
      - ./companion/init-db.sql:/docker-entrypoint-initdb.d/20-lab-table.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse 'SELECT 1'
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s
    networks: [data]
  web:
    image: araiza-s3-compose:local
    build:
      context: .
      target: with-db
    environment:
      DB_URL: jdbc:mysql://db:3306/ors?connectTimeout=3000&socketTimeout=5000
      DB_USER: ors_app
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup first}
      JAVA_OPTS: "-Xms32m -Xmx192m"
      RESUME_DIRECTORY: /var/lab/resumes
    volumes:
      - resumes:/var/lab/resumes
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/lab/health"]
      interval: 5s
      timeout: 6s
      retries: 18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, data]
  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports: ["127.0.0.1:${WEB_PORT}:80"]
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
networks:
  edge:
    name: s3-edge-net
  data:
    name: ors-net
    internal: true
volumes:
  db-data:
    name: s3-db-data
  resumes:
    name: s3-resumes
