<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Recruitment applications lab companion</title>
<h1>Recruitment applications</h1>
<p>Separate lab companion. Enter synthetic data only.</p>
<form method="post" action="records" enctype="multipart/form-data">
    <label>Application reference <input name="reference" maxlength="60" required></label>
    <label>Position <input name="position" placeholder="Analyst" pattern="(Developer|Analyst|Designer)" required></label>
<label>Resume (synthetic text or PDF, max 2 MiB) <input type="file" name="resume" accept=".txt,.pdf" required></label>
    <button>Save</button>
</form>
<p><a href="records">Read saved records</a> · <a href="health">Check database</a> · <a href="../">Original Java app</a></p>
</html>
