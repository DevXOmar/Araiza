name: araiza-s6
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: rentals
      MYSQL_USER: rentals_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run scripts/setup first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/setup first}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -Nse 'SELECT 1'
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s
    networks: [data]
  web:
    image: wordpress:php8.3-apache
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: rentals
      WORDPRESS_DB_USER: rentals_app
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup first}
    volumes:
      - wp-data:/var/www/html
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:${WEB_PORT}:80"]
    networks: [edge, data]
networks:
  edge:
    name: s6-net
  data:
    name: s6-data-net
    internal: true
volumes:
  db-data:
    name: s6-db-data
  wp-data:
    name: s6-wp-data
